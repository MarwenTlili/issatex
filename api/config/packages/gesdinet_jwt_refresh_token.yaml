gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken

    # (Time To Live) 1 month = 30×24×60×60 = 2592000 seconds
    # (eg., 604800 = 7 days, 1209600 = 14 days)
    ttl: 604800

    token_parameter_name: refresh_token

    # Return expiration to the client (UX friendly)
    return_expiration: true
    return_expiration_parameter_name: refresh_token_expiration

    # Security choice:
    # true  → more secure (rotation)
    # false → easier for mobile / SPAs
    single_use: false
