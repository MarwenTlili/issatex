gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    # (Time To Live) 1 month = 30×24×60×60 = 2592000 seconds
    # 604800 = 7 days
    ttl: 604800
    token_parameter_name: refresh_token
    # return_expiration_parameter_name: refresh_expires_in
    return_expiration: false
    single_use: false
