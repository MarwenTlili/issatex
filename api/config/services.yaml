# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\State\UserPasswordHasher:
        bind:
            $processor: '@api_platform.doctrine.orm.state.persist_processor'
    
    App\EventListener\GenericPostPersistEventListener:
        arguments:
            $prefixes:
                App\Entity\AffectationEmployeIlot: 'AIE'
                App\Entity\Article: 'ART'
                App\Entity\Client: 'CLI'
                App\Entity\Employe: 'EMP'
                App\Entity\Ilot: 'ILO'
                App\Entity\Machine: 'MAC'
                App\Entity\OrdreFabrication: 'ORD'
                App\Entity\Planning: 'PLA'
                App\Entity\Presence: 'PRE'
                App\Entity\Production: 'PRO'
                App\Entity\TailleOrdreFabrication: 'TOF'
                App\Entity\User: 'USR'
                App\Entity\Avatar: 'AVA'
                App\Entity\Notification: 'NOT'
        tags:
            - { name: doctrine.entity_listener }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\EventListener\JWTCreatedListener:
        arguments: [ '@request_stack' ]
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\EventListener\JWTAuthenticationListener:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $mercureJwtProvider: '@App\Service\MercureJwtProvider'
            $accessTokenTtl: '%env(int:JWT_ACCESS_TOKEN_TTL)%'
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_failure, method: onAuthenticationFailure }

    App\Service\MercureJwtProvider:
        arguments:
            $secret: '%env(MERCURE_JWT_SECRET)%'

    App\Command\CreateAdminCommand:
        arguments:
            $adminEmail: '%env(string:ADMIN_EMAIL)%'
            $adminUsername: '%env(string:ADMIN_USERNAME)%'
            $adminPassword: '%env(string:ADMIN_PASSWORD)%'
